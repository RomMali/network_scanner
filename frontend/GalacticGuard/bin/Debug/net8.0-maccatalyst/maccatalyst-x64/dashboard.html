<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .chart-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 300px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chart {
            width: 100%;
            height: 250px;
        }
    </style>
</head>
<body>
    <h2>Threat Intelligence Dashboard</h2>
    <div class="dashboard">
        <div class="chart-box">
            <div class="chart-title">System Score (Last Day)</div>
            <div id="chart1" class="chart"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">Risk Category Breakdown (Last Hour)</div>
            <div id="chart2" class="chart"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">Users with the Highest Risk Score</div>
            <div id="chart3" class="chart"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">Users with the Most Recent Risk Activity</div>
            <div id="chart4" class="chart"></div>
        </div>
    </div>

    <script>
        function createLineChart(containerId, data) {
            const width = 300, height = 200;
            const svg = d3.select(`#${containerId}`).append("svg")
                .attr("width", width)
                .attr("height", height);

            const x = d3.scaleLinear().domain([0, data.length - 1]).range([40, width - 20]);
            const y = d3.scaleLinear().domain([0, d3.max(data)]).range([height - 20, 20]);

            const line = d3.line()
                .x((d, i) => x(i))
                .y(d => y(d))
                .curve(d3.curveMonotoneX);

            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "#007BFF")
                .attr("stroke-width", 2)
                .attr("d", line);
        }

        function createPieChart(containerId, data, colors) {
            const width = 200, height = 200, radius = width / 2;
            const svg = d3.select(`#${containerId}`).append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${width / 2},${height / 2})`);

            const pie = d3.pie().value(d => d.value);
            const arc = d3.arc().innerRadius(0).outerRadius(radius);
            const colorScale = d3.scaleOrdinal(colors);

            svg.selectAll("path")
                .data(pie(data))
                .enter().append("path")
                .attr("d", arc)
                .attr("fill", (d, i) => colorScale(i));
        }

        const lineData = [1000, 3000, 6000, 9000, 10000, 8000, 6000];
        createLineChart("chart1", lineData);

        const pieData = [
            { category: "User Behavior", value: 50 },
            { category: "User Access", value: 20 },
            { category: "User Privilege", value: 20 },
            { category: "User Geography", value: 10 }
        ];
        createPieChart("chart2", pieData, d3.schemeSet2);

        createLineChart("chart3", [5000, 8000, 6000, 4000, 7000]);
        createLineChart("chart4", [2000, 3000, 5000, 7000, 9000]);

    </script>
</body>
</html>
